<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Gradients for 3D effect on atoms -->
    <radialGradient id="gradCa" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgb(180,180,220);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(100,100,150);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="gradS" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgb(255,255,150);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(200,200,50);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="gradO" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgb(255,150,150);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(200,50,50);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="gradMolC" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgb(150,150,150);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(80,80,80);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="gradMolHead" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgb(150,220,150);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(50,150,50);stop-opacity:1" />
    </radialGradient>
    
    <!-- Pattern for CaSO4 Slab -->
    <pattern id="caso4Pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#e0e6ed"/>
      <circle cx="15" cy="15" r="10" fill="url(#gradCa)" /> <!-- Ca -->
      <circle cx="45" cy="45" r="10" fill="url(#gradCa)" /> <!-- Ca -->
      <!-- Simplified SO4 group representation -->
      <g transform="translate(45, 15)">
          <circle cx="0" cy="0" r="7" fill="url(#gradS)" />
          <circle cx="-7" cy="-5" r="4" fill="url(#gradO)" />
          <circle cx="7" cy="-5" r="4" fill="url(#gradO)" />
          <circle cx="0" cy="8" r="4" fill="url(#gradO)" />
      </g>
       <g transform="translate(15, 45)">
          <circle cx="0" cy="0" r="7" fill="url(#gradS)" />
          <circle cx="-7" cy="-5" r="4" fill="url(#gradO)" />
          <circle cx="7" cy="-5" r="4" fill="url(#gradO)" />
          <circle cx="0" cy="8" r="4" fill="url(#gradO)" />
      </g>
    </pattern>

    <!-- Marker for Z-axis arrow -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
    refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Main Background -->
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>

  <!-- === Layer 1: CaSO4 Slab (Bottom) === -->
  <g id="CaSO4_Slab" transform="translate(100, 450)">
    <rect x="0" y="0" width="600" height="120" fill="url(#caso4Pattern)" stroke="#7a8b9e" stroke-width="2"/>
    <line x1="0" y1="0" x2="600" y2="0" stroke="#555" stroke-width="3"/> <!-- Interface line -->
  </g>

  <!-- === Layer 2: z_buffer (Middle) === -->
  <g id="z_buffer_zone" transform="translate(100, 350)">
    <!-- Semi-transparent fill to denote a "zone" rather than a physical object -->
    <rect x="0" y="0" width="600" height="100" fill="rgba(200, 220, 255, 0.4)" stroke="#7a8b9e" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- === Layer 3: Packing Vacuum & Molecules (Top) === -->
  <g id="packing_vacuum" transform="translate(100, 50)">
    <rect x="0" y="0" width="600" height="300" fill="rgba(245, 245, 255, 0.5)" stroke="#ccc" stroke-width="1"/>
    
    <!-- Packed Molecules (Simplified surfactant-like chains) -->
    <g id="molecules">
      <!-- Molecule 1 -->
      <g transform="translate(50, 220) rotate(-10)">
        <circle cx="0" cy="0" r="12" fill="url(#gradMolHead)" stroke="#333" stroke-width="1"/>
        <line x1="0" y1="0" x2="20" y2="-40" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="20" cy="-40" r="8" fill="url(#gradMolC)"/>
        <line x1="20" y1="-40" x2="40" y2="-80" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="40" cy="-80" r="8" fill="url(#gradMolC)"/>
        <line x1="40" y1="-80" x2="30" y2="-120" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="30" cy="-120" r="8" fill="url(#gradMolC)"/>
      </g>
       <!-- Molecule 2 (Deeper packing) -->
      <g transform="translate(150, 260) rotate(5)">
        <circle cx="0" cy="0" r="12" fill="url(#gradMolHead)" stroke="#333" stroke-width="1"/>
        <line x1="0" y1="0" x2="-10" y2="-45" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-10" cy="-45" r="8" fill="url(#gradMolC)"/>
        <line x1="-10" y1="-45" x2="10" y2="-85" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="10" cy="-85" r="8" fill="url(#gradMolC)"/>
         <line x1="10" y1="-85" x2="0" y2="-130" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="-130" r="8" fill="url(#gradMolC)"/>
      </g>
       <!-- Molecule 3 -->
      <g transform="translate(280, 200) rotate(-20)">
        <circle cx="0" cy="0" r="12" fill="url(#gradMolHead)" stroke="#333" stroke-width="1"/>
        <line x1="0" y1="0" x2="15" y2="-40" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="15" cy="-40" r="8" fill="url(#gradMolC)"/>
        <line x1="15" y1="-40" x2="5" y2="-90" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="5" cy="-90" r="8" fill="url(#gradMolC)"/>
      </g>
       <!-- Molecule 4 -->
      <g transform="translate(400, 230) rotate(15)">
        <circle cx="0" cy="0" r="12" fill="url(#gradMolHead)" stroke="#333" stroke-width="1"/>
        <line x1="0" y1="0" x2="-20" y2="-35" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-20" cy="-35" r="8" fill="url(#gradMolC)"/>
        <line x1="-20" y1="-35" x2="-30" y2="-80" stroke="#666" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-30" cy="-80" r="8" fill="url(#gradMolC)"/>
      </g>
      <!-- More random molecules in the vacuum -->
      <circle cx="100" cy="80" r="8" fill="url(#gradMolC)"/>
      <circle cx="120" cy="90" r="8" fill="url(#gradMolC)"/>
      <line x1="100" y1="80" x2="120" y2="90" stroke="#666" stroke-width="4"/>
      
      <circle cx="500" cy="120" r="8" fill="url(#gradMolC)"/>
      <circle cx="530" cy="100" r="8" fill="url(#gradMolC)"/>
      <line x1="500" y1="120" x2="530" y2="100" stroke="#666" stroke-width="4"/>
    </g>
    <!-- Top boundary of simulation box -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#333" stroke-width="3" stroke-dasharray="10,5"/>
  </g>

  <!-- === Axes and Dimensions === -->
  <g id="axes" transform="translate(60, 570)">
    <!-- Z-axis line -->
    <line x1="0" y1="0" x2="0" y2="-520" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
    <!-- Z-axis label -->
    <text x="-15" y="-250" transform="rotate(-90 -15,-250)" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333" font-weight="bold">Z-coordinate (Å)</text>
    
    <!-- Dimension ticks -->
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#333" stroke-width="2"/> <!-- z=0 (bottom) -->
    <line x1="-5" y1="-120" x2="5" y2="-120" stroke="#333" stroke-width="2"/> <!-- Slab top -->
    <line x1="-5" y1="-220" x2="5" y2="-220" stroke="#333" stroke-width="2"/> <!-- Buffer top -->
    <line x1="-5" y1="-520" x2="5" y2="-520" stroke="#333" stroke-width="2"/> <!-- Box top -->
  </g>

  <!-- === Labels === -->
  <g id="labels" font-family="Arial, Helvetica, sans-serif">
    <!-- Main Region Labels -->
    <text x="710" y="200" font-size="20" fill="#333" font-weight="bold" alignment-baseline="middle">packing_vacuum</text>
    <text x="710" y="400" font-size="20" fill="#333" font-weight="bold" alignment-baseline="middle">z_buffer</text>
    <text x="710" y="510" font-size="20" fill="#333" font-weight="bold" alignment-baseline="middle">CaSO₄ Slab</text>
    
    <!-- Annotations -->
    <text x="400" y="30" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">Schematic of Molecule Packing on CaSO₄</text>
    <text x="105" y="365" font-size="14" fill="#555" font-style="italic">Exclusion/Transition Zone</text>
    <text x="105" y="45" font-size="14" fill="#555" font-style="italic">Simulation Box Boundary</text>

    <!-- Legend -->
    <g transform="translate(50, 50)">
        <rect x="0" y="0" width="160" height="130" fill="white" stroke="#ccc" rx="5"/>
        <text x="10" y="20" font-size="14" font-weight="bold">Legend:</text>
        
        <circle cx="20" cy="45" r="8" fill="url(#gradCa)"/>
        <text x="35" y="50" font-size="12">Ca²⁺</text>
        
        <g transform="translate(20, 75)">
            <circle cx="0" cy="0" r="6" fill="url(#gradS)"/>
            <circle cx="5" cy="4" r="3" fill="url(#gradO)"/>
        </g>
        <text x="35" y="80" font-size="12">SO₄²⁻ Group</text>
        
        <g transform="translate(20, 105)">
             <circle cx="0" cy="0" r="8" fill="url(#gradMolHead)"/>
             <line x1="0" y1="0" x2="10" y2="0" stroke="#666" stroke-width="3"/>
             <circle cx="15" cy="0" r="5" fill="url(#gradMolC)"/>
        </g>
        <text x="35" y="110" font-size="12">Packed Molecule</text>
    </g>
  </g>
</svg>